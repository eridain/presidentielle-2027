# Build, tests et publication sur GitHub Pages : https://eridain.github.io/presidentielle-2027/
# Prérequis : Settings → Pages → Build and deployment → Source = « GitHub Actions ».
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois ; une publication en cours n'est pas annulée.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
        with:
          # historique complet : `npm run data` date les fiches partis par leur dernier commit (clone superficiel = date du jour)
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund
      # src/generated/ (lu par lint, typecheck et tests) n'est pas versionné : le produire d'abord
      - run: npm run data
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # npm run build = npm run data + tsc -b + vite build → app/dist (base relative, routage par fragment)
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
