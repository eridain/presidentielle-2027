# nginx — « Vote réel » (fichier copié dans /etc/nginx/conf.d/default.conf, donc inclus dans le bloc http).
#
# Routage par fragment : toutes les vues (#/question/…, #/resultats?r=…) sont servies par index.html,
# le fragment n'est jamais envoyé au serveur. Aucune réécriture n'est donc nécessaire ; un chemin
# inconnu renvoie tout de même index.html (lien tronqué ou ancien) plutôt qu'une page d'erreur.

# Cache : fichiers à empreinte (assets/*-<hash>.*) immuables, index.html toujours revalidé
# (il référence les fichiers du dernier build).
map $uri $vote_reel_cache_control {
    ~^/assets/  "public, max-age=31536000, immutable";
    default     "no-cache";
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    # En-têtes déclarés ici seulement : un add_header dans un bloc location annulerait l'héritage.
    # La CSP complète est injectée dans index.html au build ; frame-ancestors n'est valable qu'en en-tête.
    add_header Cache-Control $vote_reel_cache_control always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Un fichier à empreinte absent est une vraie 404 (pas index.html servi comme du JavaScript).
    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
